name: Bug Report
description: Report a defect, error, or unexpected behavior in the site or workflows.
title: 'fix: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check if a similar issue already exists.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Run `pnpm dev`
        2. Navigate to '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Node version, OS, browser, package manager.
      placeholder: Node 22.x, macOS / Ubuntu, pnpm 11.x, Chromium
    validations:
      required: false
