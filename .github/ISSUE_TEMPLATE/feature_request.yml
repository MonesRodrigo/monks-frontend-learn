name: Feature Request
description: Propose a new feature, improvement, or architectural enhancement.
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Suggest an idea or improvement for the platform or workflow suite.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Opportunity
      description: Is your feature request related to a problem or a new capability?
      placeholder: I'm always frustrated when... / It would be beneficial to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: Detailed description of the feature or behavior...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you considered.
    validations:
      required: false
