name: Setup
description: Install pnpm and Node (from .nvmrc), restore the dependency cache and install deps.

inputs:
  node-version:
    description: Overrides the Node.js version from `.nvmrc` when set.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # pnpm must be installed BEFORE setup-node, otherwise `cache: pnpm` cannot
    # resolve the pnpm store path. Version is read from package.json#packageManager.
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
