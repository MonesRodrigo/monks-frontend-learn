# .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Cancel superseded runs on the same ref to save minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: MonesRodrigo/gha-ai-suite/actions/setup@7d09fbe5601e5445577186e7cda86b6bc0f5734e # v1.0.0

      - name: Format check
        run: pnpm format:check

      # Validates MDX frontmatter against the Zod schemas in src/content.config.ts
      - name: Content & type check
        run: pnpm check

  # Shared build: compiles the site once and uploads `dist` as an artifact.
  # The job name is what branch protection sees, as `Build / build`.
  build:
    name: Build
    uses: MonesRodrigo/gha-ai-suite/.github/workflows/build.yml@7d09fbe5601e5445577186e7cda86b6bc0f5734e # v1.0.0
