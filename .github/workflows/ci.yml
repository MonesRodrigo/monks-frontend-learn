# .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Cancel superseded runs on the same ref to save minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # Validates MDX frontmatter against the Zod schemas in src/content.config.ts
      - name: Content & type check
        run: pnpm check

  # Shared build: compiles the site once and uploads `dist` as an artifact.
  # The job name is what branch protection sees, as `Build / build`.
  build:
    name: Build
    uses: ./.github/workflows/_build.yml
