name: Deploy

on:
  push:
    branches: [main]
  # Allows manual redeploys from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Reuses the shared build so Pages ships the exact same artifact CI produces.
  build:
    uses: ./.github/workflows/_build.yml
    with:
      artifact-name: dist-pages
      retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
