name: Quality
on:
  pull_request:
    paths:
      - "src/**"
      - "astro.config.mjs"
      - "pnpm-lock.yaml"
      - "lighthouserc.json"
      - ".github/workflows/quality.yml"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single build shared by every quality gate below. Named so its check does not
  # collide with the CI build in branch protection.
  build:
    name: Quality build
    uses: MonesRodrigo/gha-ai-suite/.github/workflows/build.yml@7d09fbe5601e5445577186e7cda86b6bc0f5734e # v1.0.0

  quality:
    name: Quality
    needs: build
    uses: MonesRodrigo/gha-ai-suite/.github/workflows/quality.yml@7d09fbe5601e5445577186e7cda86b6bc0f5734e # v1.0.0
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      base-path: /monks-frontend-learn/
      bundle-budget-kb: 250
      lighthouse-config: lighthouserc.json

  # The suite stays read-only; publishing to code scanning is opted into here.
  a11y-sarif:
    name: Upload a11y SARIF
    needs: quality
    if: ${{ !cancelled() && needs.quality.outputs.a11y-report != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download a11y report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.quality.outputs.a11y-report }}
          path: a11y-report

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: a11y-report/a11y.sarif
          category: a11y
